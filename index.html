// Example Arduino/ESP32 code structure
#include <WiFi.h>
#include <WebServer.h>

const char* ssid = "magne";
const char* password = "12345678";

WebServer server(80);

void handleRoot() {
String html = "<!DOCTYPE html><html><head><title>Robot Control</title>";
html += "<meta name='viewport' content='width=device-width, initial-scale=1'>";
html += "<style>body { font-family: sans-serif; text-align: center; margin-top: 50px; }";
 html += "button { padding: 10px 20px; margin: 5px; font-size: 16px; }</style></head><body>";
html += "<h1>Control Your Robot</h1>";
html += "<p>Use W/A/S/D keys to move.</p>";
html += "<script>";
html += "document.addEventListener('keydown', function(event) {";
html += "  let command = '';";
html += "  if (event.key === 'w') command = 'forward';";
html += "  else if (event.key === 'a') command = 'left';";
html += "  else if (event.key === 's') command = 'backward';";
html += "  else if (event.key === 'd') command = 'right';";
html += "  else if (event.key === ' ') command = 'stop';"; // Space key to stop
html += "  if (command) {";
html += "    fetch('/control?command=' + command);";
html += "    console.log('Sent command: ' + command);";
html += "  }";
html += "});";
html += "</script>";
html += "</body></html>";
server.send(200, "text/html", html);
}

void handleControl() {
if (server.hasArg("command")) {
String command = server.arg("command");
Serial.println("Received command: " + command);
// Add your motor control logic here based on the command
if (command == "forward") {
// Move forward
} else if (command == "backward") {
// Move backward
} else if (command == "left") {
// Turn left
} else if (command == "right") {
// Turn right
} else if (command == "stop") {
// Stop motors
}
}
server.send(200, "text/plain", "Command received");
}

void setup() {
Serial.begin(115200);
pinMode(26, OUTPUT); // IN1
pinMode(27, OUTPUT); // IN2
pinMode(14, OUTPUT); // IN3
pinMode(12, OUTPUT); // IN4
// Initialize motors to stop
digitalWrite(26, LOW);
digitalWrite(27, LOW);
digitalWrite(14, LOW);
digitalWrite(12, LOW);

WiFi.begin(ssid, password);
Serial.println("Connecting to WiFi...");
while (WiFi.status() != WL_CONNECTED) {
delay(1000);
Serial.println("Connecting...");
}
Serial.println("Connected to WiFi");
Serial.print("IP Address: ");
Serial.println(WiFi.localIP());

server.on("/", handleRoot);
server.on("/control", handleControl);
server.begin();
Serial.println("HTTP server started");
}

void loop() {
server.handleClient();
}

<button onclick="copyCode()" class="mt-4 px-6 py-3 bg-green-600 text-white font-semibold rounded-md shadow hover:bg-green-700 focus:outline-none focus:ring-2 focus:ring-green-500 focus:ring-opacity-50 transition duration-200 ease-in-out">

<script>
function copyCode() {
const codeBlock = document.getElementById('code-block');
// Select the text field
codeBlock.select();
codeBlock.setSelectionRange(0, 99999); // For mobile devices

// Copy the text inside the text field
navigator.clipboard.writeText(codeBlock.value).then(() => {
// Show success message
const successMessage = document.getElementById('copy-success-message');
successMessage.classList.remove('hidden');
setTimeout(() => {
successMessage.classList.add('hidden');
}, 3000); // Hide message after 3 seconds
}).catch(err => {
console.error('Failed to copy code: ', err);
// Optionally, show an error message
});
}
</script>
